name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release contract
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version and changelog
        run: Scripts/release/verify-version.sh "$GITHUB_REF_NAME"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Validate package contents
        run: npm run pack:check

      - name: Run Swift tests
        run: swift test --parallel

  build:
    name: Build ${{ matrix.architecture }} artifact
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Build versioned archive
        env:
          AISS_DIST_DIR: ${{ runner.temp }}/release-assets
        run: Scripts/release/build-artifact.sh

      - name: Attest archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/release-assets/*.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/release-assets/*.tar.gz
            ${{ runner.temp }}/release-assets/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify checksums and create manifest
        run: |
          cd release-assets
          sha256sum --check *.sha256
          sha256sum *.tar.gz > SHA256SUMS

      - name: Publish immutable asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.tar.gz \
            release-assets/SHA256SUMS \
            "${flags[@]}"
